<!DOCTYPE html>
<html>
<head>

<title>MCO System Login</title>

<style>

body{
    background-color:#0b1a2b;
    font-family:Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:#142c44;
    padding:40px;
    border-radius:8px;
    width:350px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:10px;
    background:#2e8b57;
    color:white;
    border:none;
}

</style>

</head>

<body>

<div class="login-box">

<h2>MCO System</h2>
<p>Military Material Control</p>

<form action="/login" method="post">

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Secure Login</button>

</form>

</div>

</body>
</html>
